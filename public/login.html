<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SecureAuth | Login</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="logo">
            🔐 SecureAuth
        </div>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="register.html">
                Register
            </a>

        </div>

    </nav>



    <!-- LOGIN SECTION -->

    <div class="auth-container">

        <div class="auth-card">


            <div class="security-icon">
                🔐
            </div>


            <h1>
                Welcome Back
            </h1>


            <p class="auth-subtitle">
                Login to access your secure account
            </p>



            <!-- LOGIN FORM -->

            <form id="loginForm">


                <div class="input-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>



                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>
<div class="forgot-password">

    <a href="forgot-password.html">
        Forgot Password?
    </a>

</div>


                <button
                    type="submit"
                    class="auth-button"
                >
                    Login
                </button>


            </form>



            <!-- MESSAGE -->

            <p id="loginMessage"></p>



            <p class="auth-link">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </p>


        </div>

    </div>


    <script src="script.js"></script>


</body>

</html>
