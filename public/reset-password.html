<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SecureAuth | Reset Password</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <nav class="navbar">

        <div class="logo">
            🔐 SecureAuth
        </div>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="login.html">
                Login
            </a>

        </div>

    </nav>



    <div class="auth-container">

        <div class="auth-card">

            <div class="security-icon">
                🔒
            </div>


            <h1>
                Reset Password
            </h1>


            <p class="auth-subtitle">

                Create a new secure password
                for your account.

            </p>



            <form id="resetPasswordForm">


                <div class="input-group">

                    <label for="newPassword">
                        New Password
                    </label>

                    <input
                        type="password"
                        id="newPassword"
                        placeholder="Enter new password"
                        required
                    >

                </div>



                <div class="input-group">

                    <label for="confirmNewPassword">
                        Confirm New Password
                    </label>

                    <input
                        type="password"
                        id="confirmNewPassword"
                        placeholder="Confirm new password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-button"
                >
                    Reset Password
                </button>


            </form>


            <p id="resetMessage"></p>


            <p class="auth-link">

                Remember your password?

                <a href="login.html">
                    Login here
                </a>

            </p>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
