<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SecureAuth | Forgot Password</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <!-- ==========================================
         NAVBAR
    =========================================== -->

    <nav class="navbar">

        <div class="logo">
            🔐 SecureAuth
        </div>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="login.html">
                Login
            </a>

        </div>

    </nav>


    <!-- ==========================================
         FORGOT PASSWORD
    =========================================== -->

    <div class="auth-container">

        <div class="auth-card">

            <div class="security-icon">
                🔑
            </div>

            <h1>
                Forgot Password?
            </h1>

            <p class="auth-subtitle">

                Enter your registered email
                address and we will send you
                a password reset link.

            </p>


            <form id="forgotPasswordForm">

                <div class="input-group">

                    <label for="forgotEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="forgotEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-button"
                >
                    Send Reset Link
                </button>

            </form>


            <!-- Message -->

            <p id="forgotMessage"></p>


            <!-- ==========================================
                 EMAIL SUCCESS MESSAGE
                 NO RESET LINK IS DISPLAYED HERE
            =========================================== -->

            <div
                id="emailSentMessage"
                class="reset-link-container"
                style="display: none;"
            >

                <div
                    style="
                        font-size: 40px;
                        margin-bottom: 10px;
                    "
                >
                    📧
                </div>

                <h3>
                    Check Your Email
                </h3>

                <p>
                    A password reset link has
                    been sent to your registered
                    email address.
                </p>

                <p>
                    The link will expire in
                    <strong>15 minutes</strong>.
                </p>

            </div>


            <p class="auth-link">

                Remember your password?

                <a href="login.html">
                    Login here
                </a>

            </p>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
